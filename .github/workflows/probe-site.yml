name: Prova lettura sito
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p debug
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          curl -sSL -A "$UA" https://test.eventdimension.com/ -o debug/home.html || true
          curl -sSL -A "$UA" https://test.eventdimension.com/eventi/time-warp-2027 -o debug/festival.html || true
          curl -sSL -A "$UA" https://ticketdimension.it/evento/traumer -o debug/club.html || true
          curl -sSL -A "$UA" https://test.eventdimension.com/club -o debug/clubpage.html || true
          curl -sSL -A "$UA" https://test.eventdimension.com/festival -o debug/festivalpage.html || true
          curl -sSL -A "$UA" https://eventdimension.com/ -o debug/live.html || true
          ls -la debug
          git config user.name "eventdimension-bot"; git config user.email "bot@users.noreply.github.com"
          git add debug && git commit -m "debug sito" && git push || true
