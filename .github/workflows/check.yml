name: Verifica configurazione

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - env:
          TEST_SITE: "1"
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MEDIA_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main/media
        run: python check.py
