name: Pubblica su Instagram

on:
  schedule:
    - cron: "*/10 * * * *"   # ogni 10 minuti (GitHub può ritardare di qualche minuto)
  workflow_dispatch: {}       # avvio manuale da Actions

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - name: Browser per scaricare le locandine (solo se servono conversioni)
        run: |
          if python -c "import csv,sys; rows=[r for r in csv.DictReader(open('calendar.csv',encoding='utf-8')) if r['status'] in ('','scheduled') and r['type'].upper()!='REMINDER']; sys.exit(0 if any(m.strip().startswith('http') and not m.strip().lower().split('?')[0].endswith(('.jpg','.jpeg','.mp4')) for r in rows for m in r['media'].split('|')) else 1)"; then
            pip install --quiet playwright && python -m playwright install --with-deps chromium
          fi
      - name: Pubblica i contenuti in scadenza
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MEDIA_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main/media
        run: python publish.py
      - name: Salva lo stato nel calendario
        run: |
          if [ -n "$(git status --porcelain calendar.csv media)" ]; then
            git config user.name "eventdimension-bot"
            git config user.email "bot@users.noreply.github.com"
            git add calendar.csv media
            git commit -m "Aggiorna stato pubblicazioni"
            git pull --rebase
            git push
          fi
