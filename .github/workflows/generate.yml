name: Crea grafiche eventi

on:
  push:
    branches: [main]
    paths: ["events.csv"]
  schedule:
    - cron: "17 */4 * * *"   # ogni 4 ore: controlla il sito, crea le grafiche, allunga il piano
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controlla il sito (eventi nuovi, date, locandine)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python sync_events.py || echo "controllo sito non riuscito, continuo"
      - name: Strumenti
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji >/dev/null
          pip install --quiet pillow playwright && python -m playwright install --with-deps chromium
      - name: Crea post, storie e reel per gli eventi nuovi
        run: python generate.py || echo "alcune grafiche non create"
      - name: Allunga il piano notifiche
        run: python autoplan.py
      - name: Salva
        run: |
          if [ -n "$(git status --porcelain media events.csv calendar.csv)" ]; then
            git config user.name "eventdimension-bot"
            git config user.email "bot@users.noreply.github.com"
            git add media events.csv calendar.csv
            git commit -m "Sito controllato: grafiche e piano aggiornati"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
